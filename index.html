<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SMS Bomber NP — Send SMS Demo</title><style>body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a;margin:0}.container{max-width:720px;margin:auto;padding:0 16px}.nav{height:56px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;text-decoration:none;color:#0f172a}.brand span{color:#dc2626}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:24px;margin:24px 0;box-shadow:0 4px 20px rgba(0,0,0,.06)}h1{font-size:24px;margin:30px 0 5px}p{color:#475569;font-size:14px}.warning{padding:12px 14px;background:#fef2f2;border:1px solid #dc2626;border-radius:10px;color:#dc2626;font-size:12px;font-weight:700;margin:18px 0}.tabs{display:flex;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin:20px 0}.tab{flex:1;padding:11px;border:0;background:#fff;color:#475569;font-weight:700;cursor:pointer}.tab.active{background:#dc2626;color:#fff}.panel{display:none}.panel.active{display:block}.label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}.input{width:100%;padding:11px 13px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;box-sizing:border-box;font:inherit}.check{display:flex;gap:8px;margin:14px 0;font-size:12px;color:#475569}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#dc2626;color:#fff;font-weight:800;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.stat{text-align:center;background:#f1f5f9;padding:10px;border-radius:8px}.stat b{display:block;font-size:20px}.stat small{font-size:9px;color:#94a3b8}.terminal{margin-top:18px;background:#0f172a;color:#cbd5e1;border-radius:10px;padding:12px;height:150px;overflow:auto;font:11px/1.7 monospace}.ok{color:#34d399}.err{color:#f87171}@media(max-width:500px){.card{padding:18px}.stats{grid-template-columns:1fr 1fr 1fr}}
</style></head><body><nav class="nav"><div class="container"><a class="brand" href="index.html">SMS <span>Bomber</span> NP</a></div></nav><main class="container"><h1>SMS Demonstration Tool</h1><p>For educational security research only.</p><div class="warning">⚠️ Simulation only. This clone does not send real SMS messages or contact any SMS provider.</div><div class="tabs"><button class="tab active" id="s">Single Number</button><button class="tab" id="b">Bulk Numbers</button></div><section class="panel active card" id="single"><h2>Single Number</h2><label class="label">Phone Number</label><input class="input" id="phone" maxlength="10" inputmode="numeric" placeholder="98XXXXXXXX"><label class="label">Number of Messages</label><input class="input" id="count" type="number" min="1" max="20" value="1"><label class="check"><input type="checkbox" id="agree"> I understand this is a local educational simulation.</label><button class="btn" id="run">Run Simulation</button></section><section class="panel card" id="bulk"><h2>Bulk Numbers</h2><label class="label">Phone Numbers (one per line)</label><textarea class="input" id="numbers" rows="5" placeholder="98XXXXXXXX"></textarea><label class="check"><input type="checkbox" id="agree2"> I understand this is a local educational simulation.</label><button class="btn" id="run2">Run Bulk Simulation</button></section><div class="stats"><div class="stat"><b id="sent">0</b><small>Events</small></div><div class="stat"><b id="ok" class="ok">0</b><small>Allowed</small></div><div class="stat"><b id="blocked" class="err">0</b><small>Blocked</small></div></div><div class="terminal" id="log">[ready] Local educational simulator initialized.\n</div></main><script>const $=x=>document.getElementById(x);let sent=0,blocked=0;function log(x,c=''){let d=document.createElement('div');d.className=c;d.textContent='['+new Date().toLocaleTimeString()+'] '+x;$("log").appendChild(d);$("log").scrollTop=$("log").scrollHeight}function update(){$("sent").textContent=sent;$("blocked").textContent=blocked;$("ok").textContent=sent-blocked}$("s").onclick=()=>{$("s").classList.add('active');$("b").classList.remove('active');$("single").classList.add('active');$("bulk").classList.remove('active')};$("b").onclick=()=>{$("b").classList.add('active');$("s").classList.remove('active');$("bulk").classList.add('active');$("single").classList.remove('active')};async function simulate(list){for(let i=0;i<list;i++){await new Promise(r=>setTimeout(r,300));sent++;if(i>=3){blocked++;log('Event #'+(i+1)+' blocked by simulated rate limiter.','err')}else log('Event #'+(i+1)+' allowed locally.','ok');update()}log('Complete. No network request was made.','ok')}$("run").onclick=()=>{let p=$("phone").value.replace(/\D/g,'');let n=Math.min(20,Math.max(1,+$("count").value||1));if(!/^9[678]\d{8}$/.test(p))return log('Invalid Nepal number.','err');if(!$("agree").checked)return log('Confirm educational simulation first.','err');simulate(n)};$("run2").onclick=()=>{let n=$("numbers").value.split(/[\n,;\s]+/).filter(x=>/^9[678]\d{8}$/.test(x)).length;if(!n)return log('No valid Nepal test numbers found.','err');if(!$("agree2").checked)return log('Confirm educational simulation first.','err');simulate(Math.min(20,n*3))}</script></body></html>
