<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dc2626"><link rel="manifest" href="manifest.json"><title>Simulation History — SMS Lab</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f7f7f8;color:#171717}.wrap{max-width:1000px;margin:auto;padding:24px}.nav{position:sticky;top:0;background:#ffffffee;backdrop-filter:blur(14px);border-bottom:1px solid #eee;z-index:2}.navin{max-width:1000px;margin:auto;padding:15px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;color:#dc2626}.nav a{color:#555;text-decoration:none;margin-left:16px;font-size:14px}.hero{padding:42px 0 24px}.eyebrow{color:#dc2626;font-weight:700;font-size:13px}.hero h1{font-size:clamp(30px,6vw,54px);margin:8px 0}.hero p{color:#666}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;background:#dc2626;color:white}.btn.alt{background:#eee;color:#222}.card{background:white;border:1px solid #e8e8e8;border-radius:20px;padding:18px;box-shadow:0 8px 30px #00000008;margin-bottom:12px}.row{display:grid;grid-template-columns:1.3fr repeat(5,1fr);gap:10px;align-items:center}.head{font-size:12px;color:#777;font-weight:700}.value{font-weight:700}.muted{color:#777;font-size:13px}.empty{text-align:center;padding:50px 20px;color:#777}@media(max-width:700px){.row{grid-template-columns:1fr 1fr 1fr}.head{display:none}.row>div:first-child{grid-column:1/-1}.nav a{margin-left:8px;font-size:12px}.wrap{padding:18px}}</style></head><body><header class="nav"><div class="navin"><div class="brand">SMS Bomber NP</div><div><a href="index.html">Lab</a><a href="history.html">History</a><a href="about.html">About</a></div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">LOCAL SECURITY LAB</div><h1>Simulation History</h1><p>Previous runs are stored only in this browser. Phone numbers are never saved.</p><div class="actions"><button class="btn" id="export">Export JSON</button><button class="btn alt" id="clear">Clear History</button></div></section><section id="list"></section></main><script>const KEY='smsLabHistory';const list=document.getElementById('list');function get(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function render(){const data=get();if(!data.length){list.innerHTML='<div class="card empty"><b>No simulations yet.</b><br><span class="muted">Run a local simulation from the Lab to create history.</span></div>';return}list.innerHTML=data.map(x=>`<div class="card"><div class="row"><div><b>${new Date(x.time).toLocaleString()}</b><div class="muted">${x.mode}</div></div><div><span class="head">EVENTS</span><div class="value">${x.events}</div></div><div><span class="head">ALLOWED</span><div class="value">${x.allowed}</div></div><div><span class="head">BLOCKED</span><div class="value">${x.blocked}</div></div><div><span class="head">INVALID</span><div class="value">${x.invalid}</div></div><div><span class="head">BLOCK RATE</span><div class="value">${x.blockRate}%</div></div></div></div>`).join('')}document.getElementById('clear').onclick=()=>{if(confirm('Clear local simulation history?')){localStorage.removeItem(KEY);render()}};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(get(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sms-lab-history.json';a.click();URL.revokeObjectURL(a.href)};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();</script></body></html>
